<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>定时鼠标移动</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main>
    <h1>定时鼠标移动</h1>
    <form>
      <label for="minutes">移动间隔（分钟）</label>
      <input id="minutes" type="number" min="1" max="60" step="1" required disabled>
      <button id="start" type="submit" disabled>在此标签页启动</button>
      <button id="stop" type="button" hidden>停止</button>
    </form>
    <p id="status" role="status">正在读取状态…</p>
  </main>
</body>
</html>
